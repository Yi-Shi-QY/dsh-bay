name: DSH Bay public release check

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm
      - name: Check public repository shape
        shell: bash
        run: |
          package_version="$(node -p "require('./packages/workbench-core/package.json').version")"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then test "${GITHUB_REF_NAME}" = "v${package_version}"; fi
          if git ls-files | grep -E '(^|/)(\.env|.*\.log|.*\.tgz|releases/.*private|docs/reviews|dsh-superagent)(/|$)'; then exit 1; fi
          if git grep -n -E 'C:\\\\Users\\\\|dsh-bay@0\.2\.2-alpha\.|releases/[^[:space:]]*-private|private staging' -- ':!.github/workflows/public-release-check.yml'; then exit 1; fi
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check:dsh-dependencies
      - run: pnpm check:compat
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm pack:core
      - name: Verify public candidate metadata and checksum
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto'
          import { readFileSync } from 'node:fs'
          import path from 'node:path'

          const manifest = JSON.parse(readFileSync('packages/workbench-core/package.json', 'utf8'))
          const output = path.join('releases', manifest.version)
          const candidate = JSON.parse(readFileSync(path.join(output, 'candidate.json'), 'utf8'))
          if (candidate.status !== 'public-beta') throw new Error('Candidate is not marked public-beta')
          if (candidate.packageName !== manifest.name || candidate.version !== manifest.version) throw new Error('Candidate identity mismatch')
          if (candidate.dshGeneration !== manifest.dsh.workbench.dshGeneration) throw new Error('Candidate DSH generation mismatch')
          if (candidate.dshCompatibility !== manifest.engines.dsh) throw new Error('Candidate DSH compatibility mismatch')
          const artifact = readFileSync(candidate.artifact.path)
          const digest = createHash('sha256').update(artifact).digest('hex')
          const integrity = `sha512-${createHash('sha512').update(artifact).digest('base64')}`
          if (artifact.length !== candidate.artifact.size || digest !== candidate.artifact.sha256 || integrity !== candidate.artifact.integrity) throw new Error('Candidate artifact checksum mismatch')
          NODE
