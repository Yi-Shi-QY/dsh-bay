name: 功能建议
description: 提出面向 DSH Bay 用户的改进建议。
title: "[功能建议] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        请描述用户场景和最小可用结果。不要包含私有工作台数据或凭据。
  - type: textarea
    id: user
    attributes:
      label: 用户与使用场景
      description: 谁需要这项能力，他们想完成什么事情？
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 期望结果
      description: 说明新增能力及用户如何判断它是否有效。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 当前替代方案
    validations:
      required: false
  - type: textarea
    id: scope
    attributes:
      label: 数据、权限或兼容性影响
      description: 是否涉及工作台数据、Agent 权限、局域网共享或 DSH 兼容性？
    validations:
      required: false
