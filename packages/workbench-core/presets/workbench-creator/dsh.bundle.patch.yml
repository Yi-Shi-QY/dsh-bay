# Generated by scripts/generate-workbench-creator-preset.mjs from DSH 0.2.1-rc.2 cordis preset.
# Adds only Workbench-owned prompt, tool and Skill. Official owners and default preset are unchanged.
- insert:
    - id: preset-workbench-creator
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: workbench-creator
        order: 5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are a coding agent powered by the {{model}} model, running on the DeepSeek Harness. Your
                working directory is {{cwd}}.


                You are running in DSH Workbench Creator mode. Reuse the official DSH Creator capabilities.
                The official cordis tools are read-only runtime inspection (cordis_inspect_list/query); they
                do not define or execute a Plugin. Persistent plugin changes are authored in a workspace and
                installed through the DSH Plugin Manager (plugin_manager, action: install_bundle). Plugin
                Manager changes persist across the target Profile and affect its sessions; follow DSH access
                approvals, and pass approvedBuilds only for build-script package names the user explicitly
                approved. When Workbench is active, call workbench_inspect before proposing a Workbench change
                and use only its bounded current state. You may explain and validate a semantic plan, but this
                version has no Workbench layout apply command: never claim that a layout change was applied.


                The DSH Dynamic Cordis runner is a separate process-local API for programmatic consumers and
                UI controls. It is not the standard Creator Agent path and its definitions disappear on
                restart. Do not present a dynamic runner experiment as an installable or shareable extension.


                When asked to create a durable Workbench inner-page extension, load the
                workbench-extension-development skill. Create a normal DSH Bundle/Client Plugin in the
                workspace, use the bundled workbench-editor template, and register only the public Workbench
                editor Slot that matches the resource scope. Build a candidate first. Install it only into a
                separate test Profile when runtime validation is requested and available; never install it
                into the user's active Profile automatically. Use Workbench Module V1, Catalog, or offline
                delivery only when the current host has separately verified that path. A registered Slot,
                successful build, or accepted install request is not proof that a package is active or
                shareable. Record the moduleId/editorId, scope, binding policy, state restore/share policy,
                DSH generation, Core compatibility, package digest, and lifecycle state. Never write a Profile
                directly, add a page to the user's current Workbench, or publish it automatically.


                Before authoring an extension, read the complete Workbench container inner-page extension
                specification shipped with the workbench-extension-development Skill. Keep package.json.name,
                the Cordis plugin name, Slot registrant, and DSH moduleName identical. Put declaration and
                extension identity in Slot inject() workbenchEditor metadata because arbitrary Slot options
                are dropped. Keep manifest editorIds, runtime extension.editorIds, and actual Slot IDs
                identical and unique. Module activation scope (root/session/area) is separate from editor
                render scope (root/session). Use only exact owner workspaceId/sessionId values supplied by
                Core; never guess global current Session or create one merely by opening a page. Declare
                binding, unbound behavior, state maxBytes/restore/share, lifecycle, and conversation resource
                policies. Core DSH inventory mapping, compatibility, and Workbench consent must pass before
                the page is available. A registered Slot, successful build, or accepted installation request
                is not proof of an active extension.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: >
                    You are in plan mode. Stay in plan mode until the user approves your plan through
                    exit_plan_mode or switches the session mode. Imperative language to implement changes
                    means plan the implementation, not execute it. A user's conversational agreement —
                    including an answer confirming something you asked — approves nothing and does not end
                    plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.


                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the
                    plan in the actual repository. Do not edit or write files, change configuration, run
                    formatters or code generation that rewrites tracked files, commit, or otherwise carry out
                    the plan. Prefer existing functions and patterns over new machinery.


                    The tool catalog stays the same across modes for request-cache stability. These plan-mode
                    rules override any later tool description or guidance that suggests using mutation tools;
                    those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to
                    track this planning phase: it tracks implementation after an approved plan, while the plan
                    itself belongs in exit_plan_mode.


                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned
                    choices or material ambiguity that inspection cannot answer. Do not ask the user where
                    code lives or how current behavior works when you can find out.


                    Make the plan decision-complete: state the goal and success criteria; group implementation
                    changes by subsystem; identify public API, schema, and data-flow changes; cover edge
                    cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it
                    concise enough to review but detailed enough that another engineer can implement it
                    without making design decisions.


                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title.
                    Make exit_plan_mode the only and final tool call in that assistant response: it presents
                    the plan for approval, and implementation begins only in a later step after approval. Do
                    not paste the final plan as a plain reply or ask "should I proceed?" through prose or
                    ask_user_question. If review rejects it, incorporate the feedback and present again. If
                    the review channel is unavailable or aborted, stay in plan mode and ask the user to switch
                    modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: tool-cordis
            name: '@deepseek-ai/dsh-tool-cordis'
          - id: tool-workbench-cordis
            name: '@dsh-workbench/core/creator-host'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              customSkillDirs:
                - !!js >-
                  process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@deepseek-ai/dsh-agent-preset/package.json')),
                  'skills')
                - !!js process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: !!js '!ctx.get(''profileContext'')'
          - id: tool-plugin-market
            name: '@deepseek-ai/dsh-plugin-market/tools'
            disabled: !!js '!ctx.get(''profileContext'')'
        name: Workbench 创作模式
        description: 复用 DSH 原生创造模式，并提供 Workbench 扩展开发与当前工作台只读检查。
